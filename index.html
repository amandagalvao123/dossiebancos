<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento PMT Semanal — Grupo Ragga</title>
<style>
  :root{
    --roxo:#332452; --roxo-2:#4A3170; --roxo-3:#6E4CA0;
    --lilas:#F0EBF7; --linha:#DED3EC; --tinta:#2A1B3D; --cinza:#6E6180;
    --vermelho:#C1272D; --verde:#1B7F3B; --ambar:#B07000; --papel:#FBFAFD;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45}
  .topo{background:#fff;border-bottom:1px solid var(--linha);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .topo img{height:40px}
  .topo .sub{color:var(--cinza);font-size:13px}
  .barra{background:var(--roxo);color:#fff;padding:12px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .barra label{font-size:12px;color:#E4D9F2}
  input[type=date],input[type=text],input[type=number],textarea{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--linha);border-radius:4px;background:#fff;color:var(--tinta)}
  textarea{width:100%;resize:vertical}
  button{font-family:inherit;font-size:13px;padding:7px 13px;border:0;border-radius:4px;background:var(--roxo-3);color:#fff;cursor:pointer}
  button:hover{background:var(--roxo-2)}
  button.sec{background:#fff;color:var(--roxo-2);border:1px solid var(--roxo-3)}
  button.sec:hover{background:var(--lilas)}
  button.min{padding:3px 8px;font-size:12px}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #FFD24A;outline-offset:1px}
  nav{display:flex;gap:2px;background:var(--roxo);padding:0 14px;flex-wrap:wrap}
  nav button{background:transparent;color:#D6C7EA;border-radius:6px 6px 0 0;padding:10px 16px}
  nav button.on{background:var(--papel);color:var(--roxo);font-weight:bold}
  main{padding:20px;max-width:1300px;margin:0 auto}
  .grade{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:20px}
  @media(max-width:980px){.grade{grid-template-columns:1fr}}
  .bloco{background:#fff;border:1px solid var(--linha);border-radius:6px;padding:16px;margin-bottom:16px}
  .bloco h2{margin:0 0 12px;font-size:15px;color:var(--roxo)}
  .bloco h3{margin:16px 0 8px;font-size:13px;color:var(--cinza)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:5px 8px;border-bottom:1px solid var(--linha);text-align:left}
  th{background:var(--lilas);color:var(--roxo);font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.pago td{background:#F1F8F2}
  tr.aberto td{background:#FFFCF0}
  tr.proj td{color:var(--cinza);background:#FCFAFE}
  .tag{font-size:11px;padding:1px 6px;border-radius:9px;white-space:nowrap}
  .t-atraso{background:#FBE6E7;color:var(--vermelho)} .t-pago{background:#E4F3E8;color:var(--verde)}
  .t-aberto{background:#FDF3DC;color:var(--ambar)} .t-parcial{background:#FDE8D2;color:#A3540A}
  tr.parcial td{background:#FFF7EF}
  .exec{border-left:3px solid var(--roxo-3);padding:10px 12px;margin-bottom:10px;background:#FDFCFE}
  .exec.novo{border-left-color:var(--ambar);background:#FFFBF0}
  .exec .cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .exec .num{font-weight:bold}
  .exec .val{font-variant-numeric:tabular-nums;color:var(--cinza)}
  .raw{font-size:12px;color:var(--cinza);white-space:pre-wrap;margin:6px 0;padding:6px 8px;background:var(--lilas);border-radius:4px;max-height:110px;overflow:auto}
  .raw.mudou{background:#FFF3D6;color:#5A4200}
  .flag{font-size:12px;color:var(--cinza);display:inline-flex;align-items:center;gap:5px;margin-top:6px}
  pre.msg{background:#141019;color:#E6DCF0;padding:14px;border-radius:6px;white-space:pre-wrap;word-break:break-word;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;max-height:72vh;overflow:auto}
  .painel-msg{position:sticky;top:16px}
  .kpi{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .kpi div{background:#fff;border:1px solid var(--linha);border-left:4px solid var(--roxo-3);border-radius:5px;padding:10px 14px;min-width:150px}
  .kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;color:var(--roxo)}
  .kpi small{color:var(--cinza)}
  .aviso{font-size:12px;color:var(--cinza);margin-top:8px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--roxo);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  #toast.on{opacity:1}
  .salvar{background:#FFD24A;color:#3A2A00}
  #alertas .av{background:#FFF3D6;border-bottom:1px solid #E8D399;color:#5A4200;padding:10px 22px;font-size:13px}
  #alertas .ok2{background:#EAF6EC;border-bottom:1px solid #C6E3CD;color:#1B5B30;padding:10px 22px;font-size:13px}
  #alertas b{cursor:pointer;text-decoration:underline}
  .pend{background:#FFF3D6;border:1px solid #E8D399;color:#5A4200;padding:8px 10px;border-radius:4px;font-size:12px;margin-bottom:8px}
  nav .bolha{background:#C1272D;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:6px}
  .salvar:hover{background:#F2C230}
</style>

/* ---------- cálculo por parcela ---------- */
function vencimento(mes,dia){const[a,m]=mes.split('-').map(Number);const ult=new Date(a,m,0).getDate();return `${a}-${String(m).padStart(2,'0')}-${String(Math.min(dia,ult)).padStart(2,'0')}`;}
function saldo(p){ return Math.max(0, +(p.valor-(p.pgto||0)).toFixed(2)); }
function statusParcela(p,mes){ if(saldo(p)<=0.004) return 'pago'; return vencimento(mes,p.dia)<=DB.fechamento?'atraso':'aberto'; }
function parcelas(b){ const d=DB.bancos[b]; return d.corrente.parcelas.map((p,i)=>({...p,i,pgto:p.pgto||0,obs:p.obs||'',sld:saldo(p),venc:vencimento(d.corrente.mes,p.dia),st:statusParcela(p,d.corrente.mes),parcial:(p.pgto||0)>0&&saldo(p)>0.004})); }
const somaSt=(b,st)=>parcelas(b).filter(p=>p.st===st).reduce((s,p)=>s+p.sld,0);
const somaPago=b=>parcelas(b).reduce((s,p)=>s+p.pgto,0);
const somaParcial=b=>parcelas(b).filter(p=>p.parcial).reduce((s,p)=>s+p.pgto,0);
const histTotal=b=>DB.bancos[b].historico.reduce((s,[,v])=>s+v,0);
const totalAtraso=b=>histTotal(b)+somaSt(b,'atraso');
const totalGeral=()=>nomes().reduce((s,b)=>s+totalAtraso(b),0);
const expo=b=>DB.bancos[b].execucoes.reduce((s,e)=>s+e.val,0);
const nomes=()=>Object.keys(DB.bancos).sort((a,b)=>DB.bancos[a].ordem-DB.bancos[b].ordem);
const pmt=b=>DB.bancos[b].contratos.reduce((s,c)=>s+c.v,0);
const dataBR=()=>{const[a,m,d]=DB.fechamento.split('-');return `${d}/${m}/${a}`;};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000);}

/* ---------- mensagens ---------- */
function msgBanco(b){
  const d=DB.bancos[b], mesC=d.corrente.mes;
  const atr=somaSt(b,'atraso'), pg=somaPago(b), ab=somaSt(b,'aberto');
  let s=`*📊 PMT MENSAL – BANCO ${b}*\n*Fechamento Semanal – ${dataBR()}*\n━━━━━━\n*CONTRATOS ATIVOS:* ${d.contratos.length}\n\n`;
  const modo=d.modoContratos||'linha';
  if(d.resumo.length){ s+=d.resumo.map(x=>'• '+x).join('\n')+`\n\n*Razões:* ${d.razoes}\n\n`; }
  else if(modo==='completo') d.contratos.forEach((c,i)=>{ s+=`*${i+1}.* ${c.r}${c.c?' – '+c.c:''}\n${c.d} | *R$ ${brl(c.v)}/mês* | venc. dia ${c.dia}\n\n`; });
  else if(modo==='linha'){ d.contratos.forEach((c,i)=>{ s+=`*${i+1}.* ${c.r} – ${c.d.replace('CCB – ','')} | *R$ ${brl(c.v)}/mês*\n`; }); s+='\n'; }
  s+=`*PMT Mensal Total: R$ ${brl(pmt(b))}*\n━━━━━━\n*📅 ATRASOS ACUMULADOS*\n\n`;
  d.historico.forEach(([k,v])=>s+=`🔴 *${rot(k)}:* R$ ${brl(v)}\n`);
  if(atr>0) s+=`🔴 *${rot(mesC)}:* R$ ${brl(atr)}\n`;
  if(ab>0)  s+=`🟡 *${rot(mesC)} (a vencer):* R$ ${brl(ab)}\n`;
  if(pg>0)  s+=`🟢 *${rot(mesC)} (pago):* R$ ${brl(pg)}\n`;
  if(d.detalhe){
    const lst=parcelas(b).filter(p=>p.st!=='pago').sort((a,c)=>a.venc.localeCompare(c.venc));
    if(lst.length){
      s+=`\n*📌 PARCELAS DE ${rot(mesC).toUpperCase()}*\n`;
      if(d.agrupar){
        const g={}; lst.forEach(p=>{const k=p.venc+'|'+p.st; g[k]=g[k]||{sld:0,pg:0}; g[k].sld+=p.sld; g[k].pg+=p.pgto;});
        Object.entries(g).forEach(([k,v])=>{const[venc,st]=k.split('|');
          s+=`${v.pg>0?'🟠':(st==='atraso'?'🔴':'🟡')} ${diaBR(venc)} – R$ ${brl(v.sld)}${v.pg>0?` _(pago R$ ${brl(v.pg)})_`:''}\n`;});
      } else {
        lst.forEach(p=>{const c=d.contratos[p.ci];
          s+=`${p.parcial?'🟠':(p.st==='atraso'?'🔴':'🟡')} ${diaBR(p.venc)} | ${c.r} – ${c.d.replace('CCB – ','')} | R$ ${brl(p.sld)}`;
          s+= p.parcial?` _(pago R$ ${brl(p.pgto)} de R$ ${brl(p.valor)})_`:'';
          s+= p.obs?`\n     _${p.obs}_`:'';
          s+=`\n`;});
      }
      const pp=lst.filter(p=>p.parcial);
      if(pp.length) s+=`🟠 = pagamento parcial\n`;
    }
  }
  s+=`━━━━━━\n*💰 RESUMO FINANCEIRO*\n🔴 Total em atraso: *R$ ${brl(totalAtraso(b))}*\n━━━━━━\n`;
  const nE=d.execucoes.length,nA=d.agravos.length;
  s+=`*⚖️ STATUS JUDICIAL – ${nE} EXECUÇ${nE>1?'ÕES':'ÃO'}${nA?` + ${nA} AGRAVO${nA>1?'S':''}`:''}*\nExposição total: *R$ ${brl(expo(b))}*\n\n`;
  d.execucoes.forEach((e,i)=>{ s+=`*${i+1}. ${e.num}*${e.sigilo?' 🔒':''}${e.novo?' 🆕':''} | ${e.ent}\nR$ ${brl(e.val)}\n${e.linhas}\n\n`; });
  if(nA){ s+=`*📎 AGRAVO${nA>1?'S':''}*\n`; d.agravos.forEach(a=>s+=`• ${a.num}${a.sigilo?' 🔒':''} (${a.ref}) – ${a.novo?'🆕 ':''}${a.sit}\n`); s+=`\n`; }
  if(d.nota) s+=d.nota+`\n`;
  return s+`━━━━\n🟢 Pago | 🟡 A vencer | 🔴 Em atraso`;
}

function msgConsolidado(){
  const meses=new Set(); nomes().forEach(b=>{DB.bancos[b].historico.forEach(([k])=>meses.add(k)); meses.add(DB.bancos[b].corrente.mes);});
  const ord=[...meses].sort();
  const valMes=k=>nomes().reduce((s,b)=>{const d=DB.bancos[b];const l=d.historico.find(x=>x[0]===k);return s+(l?l[1]:(d.corrente.mes===k?somaSt(b,'atraso'):0));},0);
  let s=`*📊 CONSOLIDADO PMT – TODOS OS BANCOS*\n*Atrasos Acumulados – ${dataBR()}*\n━━━━━━\n*🏦 EVOLUÇÃO MENSAL DE ATRASOS*\n\n`;
  ord.forEach(k=>s+=`🔴 *${rot(k)}:* R$ ${brl(valMes(k))}\n`);
  const ab=nomes().reduce((s2,b)=>s2+somaSt(b,'aberto'),0);
  if(ab>0) s+=`🟡 *${rot(ord[ord.length-1])} (a vencer):* R$ ${brl(ab)}\n`;
  s+=`━━━━━━\n*🏦 ATRASO POR BANCO*\n\n`;
  nomes().map(b=>[b,totalAtraso(b)]).sort((a,c)=>c[1]-a[1]).forEach(([b,v],i)=>s+=`*${i+1}º ${b}:* R$ ${brl(v)}\n`);
  s+=`━━━━━━\n*💰 TOTAL GERAL EM ATRASO: R$ ${brl(totalGeral())}*\n━━━━━━\n`;
  const nE=nomes().reduce((s2,b)=>s2+DB.bancos[b].execucoes.length,0);
  const nA=nomes().reduce((s2,b)=>s2+DB.bancos[b].agravos.length,0);
  s+=`*⚖️ ACOMPANHAMENTO JUDICIAL*\n*${nE} execuções + ${nA} agravos = ${nE+nA} processos*\nExposição total: *R$ ${brl(nomes().reduce((s2,b)=>s2+expo(b),0))}*\n\n`;
  nomes().forEach(b=>{
    const d=DB.bancos[b];
    s+=`*🔷 ${b} – ${d.execucoes.length} execuç${d.execucoes.length>1?'ões':'ão'}${d.agravos.length?` + ${d.agravos.length} agravo${d.agravos.length>1?'s':''}`:''} | R$ ${brl(expo(b))}*\n`;
    d.execucoes.forEach(e=>{
      const ch=(e.linhas.split('\n').find(l=>l.includes('⚠️'))||'').replace('⚠️','').trim();
      s+=`• ${e.num}${e.sigilo?' 🔒':''}${e.novo?' 🆕':''} | ${e.ent} | R$ ${brl(e.val)}${ch?' ⚠️ '+ch:''}\n`;
    });
    if(d.agravos.length) s+=`• ${d.agravos.length} agravo${d.agravos.length>1?'s':''}: ${d.agravos.map(a=>a.sit).join(' / ')}\n`;
    s+=`\n`;
  });
  const nv=[]; nomes().forEach(b=>DB.bancos[b].execucoes.filter(e=>e.novo).forEach(e=>nv.push(`${b}: ${e.num} (${e.ent})`)));
  s+=`*📌 PONTOS CRUCIAIS DA SEMANA*\n`+(nv.length?nv.map(n=>'🆕 '+n).join('\n')+'\n':'✅ Sem novas execuções na semana\n');
  return s+`━━━━\n🟢 Pago | 🟡 A vencer | 🔴 Em atraso`;
}

/* ---------- projeção ---------- */
function projecao(b){
  const d=DB.bancos[b]; let k=proxMes(d.corrente.mes), acum=totalAtraso(b)+somaSt(b,'aberto'), out=[];
  while(k<=DB.projetarAte){ acum+=pmt(b); out.push([k,acum]); k=proxMes(k); }
  return out;
}

let aba='SANTANDER';
function render(){
  document.getElementById('dataFech').value=DB.fechamento;
  document.getElementById('abas').innerHTML=[...nomes(),'CONSOLIDADO','PROJEÇÃO','ATUALIZAÇÕES','HISTÓRICO'].map(a=>{
    const n=(a==='ATUALIZAÇÕES'||a==='HISTÓRICO')?0:(DB.bancos[a]?pendentes(a):0);
    return `<button class="${a===aba?'on':''}" data-aba="${a}">${a}${n?`<span class="bolha">${n}</span>`:''}</button>`;}).join('');
  const al=document.getElementById('alertas'), up=DB.ultimaPlanilha, tp=pendentesTotal();
  const base = up?`Planilha "${up.arq}" lida em ${up.quando} · ${up.ach} processos conferidos · ${up.mud} com andamento novo`:'';
  al.innerHTML = tp
    ? `<div class="av">⚠️ ${base?base+' · ':''}${tp} processo(s) aguardando sua revisão: ${nomes().filter(x=>pendentes(x)).map(x=>`<b data-ir="${x}">${x} (${pendentes(x)})</b>`).join(' · ')} · <b data-ir="ATUALIZAÇÕES">ver o que mudou</b></div>`
    : (up?`<div class="ok2">✅ ${base} · <b data-ir="ATUALIZAÇÕES">ver o que mudou</b></div>`:'');
  al.querySelectorAll('[data-ir]').forEach(x=>x.onclick=()=>{aba=x.dataset.ir;render();window.scrollTo(0,0);});

  const c=document.getElementById('conteudo');
  c.innerHTML = aba==='CONSOLIDADO'?viewCons():aba==='PROJEÇÃO'?viewProj():aba==='ATUALIZAÇÕES'?viewLog():aba==='HISTÓRICO'?viewHist():viewBanco(aba);
  eventos(); autoSalvar();
}

let semSel=null, semBanco='CONSOLIDADO';
function viewHist(){
  const S=(DB.semanas||[]).slice().sort((a,b)=>b.data.localeCompare(a.data));
  if(!S.length) return `<div class="bloco"><h2>Histórico semanal</h2>
    <p class="aviso" style="margin-top:0">Ainda não há fotos arquivadas. Clique em "Arquivar semana" na barra roxa ao terminar o fechamento — ou salve o painel, que ele arquiva sozinho.</p>
    <button id="hArq">Arquivar a situação de hoje (${dataBR()})</button></div>`;
  const max=Math.max(...S.map(x=>x.geral));
  const linhas=S.map((f,i)=>{
    const ant=S[i+1];
    const dif=ant?f.geral-ant.geral:0;
    return `<tr${f.data===semSel?' style="background:var(--lilas)"':''}>
      <td><b>${dBR(f.data)}</b><br><small style="color:var(--cinza)">${f.quando}</small></td>

      <td class="num" style="color:${dif>0?'var(--vermelho)':dif<0?'var(--verde)':'var(--cinza)'}">${ant?(dif>0?'+':'')+'R$ '+brl(dif):'—'}</td>
      ${nomes().map(b=>`<td class="num">R$ ${brl((f.bancos[b]||{}).total||0)}</td>`).join('')}
      <td class="num">${nomes().reduce((s,b)=>s+((f.bancos[b]||{}).nproc||0),0)}</td>
      <td><button class="min sec" data-ver="${f.data}">abrir</button></td></tr>`;
  }).join('');
  const f=S.find(x=>x.data===semSel);

  if(f){
    const ant=S[S.findIndex(x=>x.data===f.data)+1];
    det=`<div class="bloco"><h2>Situação em ${dBR(f.data)}</h2>
      <table><thead><tr><th>Banco</th><th class="num">Em atraso</th><th class="num">vs. semana anterior</th><th class="num">Mês corrente</th><th class="num">Exposição judicial</th><th class="num">Processos</th></tr></thead><tbody>
      ${nomes().map(b=>{const x=f.bancos[b]||{}, y=ant?(ant.bancos[b]||{}):null; const dd=y?(x.total||0)-(y.total||0):null;
        return `<tr><td>${b}</td><td class="num">R$ ${brl(x.total||0)}</td>
        <td class="num" style="color:${dd>0?'var(--vermelho)':dd<0?'var(--verde)':'var(--cinza)'}">${dd===null?'—':(dd>0?'+':'')+'R$ '+brl(dd)}</td>
        <td class="num">${x.mes?rot(x.mes):'—'}: R$ ${brl(x.atraso||0)}${x.aberto?` <span style="color:var(--ambar)">(+R$ ${brl(x.aberto)} a vencer)</span>`:''}</td>
        <td class="num">R$ ${brl(x.expo||0)}</td><td class="num">${x.nproc||0}</td></tr>`;}).join('')}
      </tbody><tfoot><tr><th>Total</th><th class="num">R$ ${brl(f.geral)}</th><th colspan="4"></th></tr></tfoot></table>
      ${nomes().filter(b=>f.bancos[b]&&f.bancos[b].retencao).map(b=>{const r=f.bancos[b].retencao;
        return `<p class="aviso">Retenção iFood ${b} (${r.data}): retido R$ ${brl(r.novo)}${r.recuperado?` · recuperado R$ ${brl(r.recuperado)}`:''}</p>`;}).join('')}

/* ---------- resumo automático a partir da planilha ---------- */
const CAP=w=>w.length<=2?w.toLowerCase():w[0].toUpperCase()+w.slice(1).toLowerCase();
function nomeCurto(n){
  n=String(n).replace(/\s*[-–]\s*em\s*\d{2}\/\d{2}\/\d{4}.*/i,'').replace(/\(.*?\)/g,'').trim();
  const ig=/^(DE|DA|DO|DOS|DAS|E|LTDA|EIRELI|ME|EPP|S\.?A\.?|COMERCIO|COMÉRCIO|ATACADISTA|ALIMENTOS|LANCHES|SERV|SERVICOS|SERVIÇOS|TREINAMENTOS)$/i;
  const p=n.split(/\s+/).filter(x=>x&&!ig.test(x));
  return p.slice(0,2).map(CAP).join(' ');
}
const SIGLAS=/^(SISBAJUD|RENAJUD|INFOJUD|IOF|CDA|FGI|CCB|CPF|CNPJ|PJ|PF|R\$|MAJ|BF|ML|IPTU|ICMS|ISS)$/;
function titulize(t){
  return String(t).replace(/\b[A-ZÀ-Ú][A-ZÀ-Ú'’.]{2,}(?:\s+[A-ZÀ-Ú&][A-ZÀ-Ú'’.]*)*\b/g, m=>
    m.split(/\s+/).map(w=>SIGLAS.test(w)?w:(w.length<=2?w.toLowerCase():w[0]+w.slice(1).toLowerCase())).join(' '));
}
function corta(t,n){
  n=n||92; t=titulize(String(t)).replace(/\s+/g,' ').replace(/^[-–•\s]+/,'').trim();
  const dp=t.search(/:\s/);
  if(dp>25&&dp<n) t=t.slice(0,dp);
  if(t.length>n){ t=t.slice(0,n).replace(/[\s,;]+\S*$/,''); }
  return t.replace(/[\s,;:.\-–]+$/,'').replace(/\s+e$/i,'').trim();
}
function condensar(t){
  t=String(t).replace(/\s+/g,' ').trim(); if(!t) return '';
  if(/segredo de justi/i.test(t)&&t.length<40) return '';
  if(/averbad[ao] (a )?certid[ãa]o premonit/i.test(t)) return '⚠️ certidão premonitória averbada em imóvel';
  const mb=t.match(/requereu o bloqueio de ativos[^.]*?em nome d[ao]s?\s+([A-ZÀ-Ú][\wÀ-ú]*(?:\s+[A-ZÀ-Ú][\wÀ-ú]*)?)/i);
  if(mb) return '⚠️ banco pediu bloqueio de ativos de '+nomeCurto(mb[1]);
  if(/requereu o bloqueio de ativos/i.test(t)) return '⚠️ banco pediu bloqueio de ativos';
  if(/negado provimento|n[ãa]o provido/i.test(t)) return 'não provido';
  if(/tutela/i.test(t)&&/n[ãa]o (concedida|deferida)|indeferi/i.test(t)) return 'tutela não concedida';
  if(/indeferi/i.test(t)&&/arresto/i.test(t)) return 'arresto indeferido';
  if(/n[ãa]o reconheceu.*cita|invalid.*cita/i.test(t)) return '✘ citações invalidadas – novas expedições';
  const mc=t.match(/cita(?:ção|ções) positiva[s]? d[oae]?s? (.+?) e negativa[s]? d[oae]?s? (.+)/i);
  if(mc) return `✔ ${nomeCurto(mc[1])} | ✘ ${nomeCurto(mc[2])}`;
  if(/cita(?:ções|ção)[^,]{0,40}negativ|negativ[^,]{0,20}cita/i.test(t)) return '✘ citações negativas';
  if(/bloque|penhor|arresto|sisbajud|constri/i.test(t)) return '⚠️ '+corta(t,95);
  if(/determinad[ao] a cita|determinou.*cita/i.test(t)) return 'citação determinada'+(/3 dias/i.test(t)?' – prazo de 3 dias úteis':'');
  if(/expedid[ao]s?.*cita|cita.*expedid/i.test(t)) return 'citações expedidas';
  if(/pendente de decis/i.test(t)) return 'pendente de decisão inicial';
  return corta(t);
}
function entradas(raw){
  const its=[]; let cur=null;
  String(raw||'').split('\n').forEach(l=>{
    const s=l.trim(); if(!s) return;
    const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})\s*:?\s*(.*)$/);
    if(m){ cur={ord:m[3]+m[2]+m[1],dt:`${m[1]}/${m[2]}`,tx:m[4]}; its.push(cur); }
    else if(cur){ cur.tx+=' '+s; }
    else { cur={ord:'0',dt:'',tx:s}; its.push(cur); }
  });
  its.sort((a,b)=>a.ord.localeCompare(b.ord));
  return its;
}
function novaLinha(p){
  const its=entradas(p.raw); if(!its.length) return '';
  const u=its[its.length-1]; const c=condensar(u.tx); if(!c) return '';
  if(c.startsWith('⚠️')) return u.dt?`⚠️ ${u.dt}: ${c.slice(2).trim()}`:c;
  return u.dt?`${u.dt}: ${c}`:c;
}
function citacaoAuto(p){
  const partes=String(p.partes||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const junto=partes.join(' ');
  if(!junto||/^n\/a$/i.test(junto)) return '';
  if(/nenhuma das partes|n[ãa]o citad/i.test(junto)) return '✘ Nenhuma parte citada';
  if(/segredo/i.test(junto)) return 'Segredo de justiça';
  const nomes=partes.map(nomeCurto).filter(Boolean);
  if(!nomes.length) return '';
  const dt=(junto.match(/(\d{2}\/\d{2})\/\d{4}/)||[])[1];
  return '✔ '+nomes.slice(0,4).join(', ')+(nomes.length>4?` +${nomes.length-4}`:'')+(dt?` (${dt})`:'');
}
const ehAndamento=l=>/^(⚠️\s*)?\d{2}\/\d{2}\s*:/.test(l.trim());
function atualizarResumo(p){
  const nova=novaLinha(p); if(!nova) return null;
  let base=String(p.linhas||'').split('\n').map(s=>s.trim()).filter(s=>s&&!ehAndamento(s));
  const chave=s=>s.replace(/[*_`]/g,'').replace(/^(?:⚠️\s*)?\d{2}\/\d{2}:\s*/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().slice(0,14);
  const corpo=nova.replace(/^(?:⚠️\s*)?\d{2}\/\d{2}:\s*/,'');
  const ehCit=/^[✔✘]/.test(corpo);
  if(ehCit) base=base.filter(l=>chave(l)!==chave(nova));
  if(!ehCit && !base.some(l=>/[✔✘]/.test(l))){ const c=citacaoAuto(p); if(c) base.push(c); }
  if(base.every(l=>chave(l)!==chave(nova))) base.push(nova);
  return base.join('\n');
}
function logar(b,num,antes,depois){
  DB.log=DB.log||[];
  DB.log.unshift({q:new Date().toLocaleString('pt-BR'),b,num,antes,depois,arq:(DB.ultimaPlanilha||{}).arq||''});
  DB.log=DB.log.slice(0,80);
}
function aplicarResumos(b){
  let n=0;
  DB.bancos[b].execucoes.forEach(e=>{ const r=atualizarResumo(e);
    if(r&&r!==e.linhas){ logar(b,e.num,e.linhas,r); e.linhas=r; e.atualizadoEm=new Date().toLocaleString('pt-BR'); n++; }
    if(r) e.pendente=false; });
  DB.bancos[b].agravos.forEach(a=>{ const l=novaLinha(a); if(!l) return;
    const m=l.match(/^(?:⚠️\s*)?(\d{2}\/\d{2}):\s*(.*)$/);
    const s=m?`${m[2]} (${m[1]})`:l;
    if(s!==a.sit){ logar(b,'Agravo '+a.num,a.sit,s); a.sit=s; a.atualizadoEm=new Date().toLocaleString('pt-BR'); n++; }
    a.pendente=false; });
  return n;
}

/* ---------- imagens (SVG -> PNG) ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const limpo=s=>String(s).replace(/[*_`]/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{FE0F}\u{2700}-\u{27BF}]/gu,'').replace(/\s+/g,' ').trim();
const corLinha=l=> l.includes('✔')?'#1B7F3B' : l.includes('✘')?'#C1272D' : l.includes('⚠')?'#B07000' : '#6E6180';
const W=980, PAD=32;
const ACENTO={'SANTANDER':'#C1272D','BRADESCO':'#C1272D','SAFRA':'#0E2A5C','ITAÚ':'#0A3A7A','CONSOLIDADO':'#4A3170'};
const SIGLA={'SANTANDER':'Santander','BRADESCO':'Bradesco','SAFRA':'Safra','ITAÚ':'Itaú'};

function montarSVG(cfg){
  const {titulo,sub,acento,secoes,destaque,evidencia,semLegenda,kpis,banco}=cfg;
  let y=0; const out=[];
  const T=(x,yy,t,{s=15,b=0,c='#2A1B3D',a='start',o=1}={})=>`<text x="${x}" y="${yy}" font-family="Arial, Helvetica, sans-serif" font-size="${s}" ${b?'font-weight="bold"':''} fill="${c}" fill-opacity="${o}" text-anchor="${a}">${esc(t)}</text>`;
  // cabeçalho
  out.push(`<rect x="0" y="0" width="${W}" height="118" fill="#2E2148"/>`);
  out.push(`<rect x="0" y="0" width="7" height="118" fill="${acento}"/>`);
  out.push(`<rect x="0" y="112" width="${W}" height="6" fill="${acento}"/>`);
  let tx=PAD;
  const lb=banco?(DB.bancos[banco]||{}).logo:'';
  if(lb){ out.push(`<rect x="${PAD}" y="26" width="112" height="60" rx="8" fill="#FFFFFF"/>`);
          out.push(`<image href="${lb}" x="${PAD+8}" y="32" width="96" height="48" preserveAspectRatio="xMidYMid meet"/>`); tx=PAD+130; }
  else if(banco){ out.push(`<rect x="${PAD}" y="30" width="76" height="52" rx="8" fill="${acento}"/>`);
          out.push(T(PAD+38,62,SIGLA[banco]||banco,{s:13,b:1,c:'#FFFFFF',a:'middle'})); tx=PAD+94; }
  out.push(T(tx,58,titulo,{s:27,b:1,c:'#FFFFFF'}));
  out.push(T(tx,84,sub,{s:14,c:'#CDBEE6'}));
  const lg=(document.querySelector('.topo img')||{}).src||'';
  if(lg){ const lw=200, lh=40;
    out.push(`<rect x="${W-PAD-lw-20}" y="34" width="${lw+20}" height="${lh+18}" rx="8" fill="#FFFFFF"/>`);
    out.push(`<image href="${lg}" x="${W-PAD-lw-10}" y="43" width="${lw}" height="${lh}" preserveAspectRatio="xMidYMid meet"/>`); }
  y=118;
  // faixa de indicadores
  if(kpis&&kpis.length){
    const h0=78, lar=(W-PAD*2-(kpis.length-1)*12)/kpis.length;
    y+=16;
    kpis.forEach((k,i)=>{
      const x=PAD+i*(lar+12);
      out.push(`<rect x="${x}" y="${y}" width="${lar}" height="${h0}" rx="7" fill="#F7F4FB" stroke="#E4DAF0"/>`);
      out.push(`<rect x="${x}" y="${y}" width="${lar}" height="4" rx="2" fill="${k.c||acento}"/>`);

      out.push(T(x+16,y+60,k.v,{s:k.v.length>14?19:22,b:1,c:k.c||'#2E2148'}));
    });
    y+=h0;
  }
  // seções
  const bloco=(dst)=>{
    const cor=dst.c||'#C1272D', fundo=dst.bg||'#F8E9EA', tinta=dst.tc||'#7A2226';
    y+=20;
    out.push(`<rect x="${PAD}" y="${y}" width="${W-PAD*2}" height="96" rx="8" fill="${fundo}"/>`);
    out.push(`<rect x="${PAD}" y="${y}" width="7" height="96" rx="3" fill="${cor}"/>`);
    out.push(T(PAD+26,y+34,dst.t,{s:15,c:tinta}));
    out.push(T(PAD+26,y+78,dst.v,{s:42,b:1,c:cor}));
    if(dst.d) out.push(T(W-PAD-26,y+70,dst.d,{s:17,b:1,c:tinta,a:'end'}));
    y+=96;
  };
  secoes.forEach(sec=>{
    if(sec.destaque){ bloco(sec.destaque); return; }
    y+=20;
    out.push(`<rect x="${PAD}" y="${y}" width="${W-PAD*2}" height="32" rx="4" fill="#EDE7F6"/>`);
    out.push(`<rect x="${PAD}" y="${y}" width="6" height="32" rx="3" fill="${acento}"/>`);
    out.push(T(PAD+18,y+21,sec.t.toUpperCase(),{s:14,b:1,c:'#2E2148'}));
    y+=32;
    if(sec.duasColunas&&sec.linhas.length>4){
      const meia=Math.ceil(sec.linhas.length/2), colW=(W-PAD*2)/2;
      sec.linhas.forEach((l,i)=>{
        const col=i<meia?0:1, lin=i<meia?i:i-meia;
        const x0=PAD+col*colW, yy=y+lin*32+22;
        if(lin%2===0) out.push(`<rect x="${x0}" y="${y+lin*32}" width="${colW-6}" height="32" fill="#FCFBFE"/>`);
        if(l.p) out.push(`<circle cx="${x0+14}" cy="${yy-5}" r="6" fill="${l.p}"/>`);
        out.push(T(x0+30,yy,l.e,{s:17,b:l.b?1:0,c:l.c||'#2A1B3D'}));
        if(l.d) out.push(T(x0+colW-24,yy,l.d,{s:17,b:1,c:l.cd||'#2A1B3D',a:'end'}));
      });
      y+=meia*32;
    } else {
      let z=0;
      sec.linhas.forEach(l=>{
        const alt=l.s?50:31;
        if(z%2===0) out.push(`<rect x="${PAD}" y="${y}" width="${W-PAD*2}" height="${alt}" fill="#FCFBFE"/>`);
        z++;
        y+=21;
        if(l.p) out.push(`<circle cx="${PAD+14}" cy="${y-6}" r="6" fill="${l.p}"/>`);
        out.push(T(PAD+(l.p?30:16),y,l.e,{s:16.5,b:l.b?1:0,c:l.c||'#2A1B3D'}));
        if(l.d) out.push(T(W-PAD-16,y,l.d,{s:16.5,b:1,c:l.cd||'#2A1B3D',a:'end'}));
        if(l.s){ y+=20; out.push(T(PAD+30,y,l.s,{s:14,c:'#7A6E88'})); }
        y+=alt-21-(l.s?20:0);
      });
    }
    y+=8;
  });
  if(destaque) bloco(destaque);
  if(evidencia){
    y+=20;
    out.push(T(PAD,y+14,'EVIDÊNCIA — EXTRATO BANCÁRIO',{s:12,b:1,c:'#2E2148'})); y+=24;
    out.push(`<rect x="${PAD-4}" y="${y-4}" width="${W-PAD*2+8}" height="336" rx="6" fill="#F7F4FB"/>`);
    out.push(`<image href="${evidencia}" x="${PAD}" y="${y}" width="${W-PAD*2}" height="328" preserveAspectRatio="xMidYMin meet"/>`);
    y+=336;
  }
  y+=22;
  out.push(`<rect x="0" y="${y}" width="${W}" height="48" fill="#2E2148"/>`);
  if(semLegenda){ out.push(T(PAD,y+30,'Assessoria da Presidência',{s:12.5,c:'#CDBEE6'})); }
  else [['#3FA45C','Pago',0],['#E0A33E','A vencer',150],['#E15C62','Em atraso',310]].forEach(([c,t,dx])=>{
    out.push(`<circle cx="${PAD+8+dx}" cy="${y+24}" r="5.5" fill="${c}"/>`);
    out.push(T(PAD+22+dx,y+29,t,{s:13,c:'#CDBEE6'}));
  });
  out.push(T(W-PAD,y+29,'Grupo Ragga · '+dataBR(),{s:12.5,c:'#9C8CB5',a:'end'}));
  y+=48;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${y}" viewBox="0 0 ${W} ${y}">
    <rect width="${W}" height="${y}" fill="#FFFFFF"/>${out.join('')}</svg>`;
}

function cardBanco(b){
  const d=DB.bancos[b], mesC=d.corrente.mes, secoes=[];
  const cont=d.resumo.length
    ? d.resumo.map(x=>({e:limpo(x),p:'#6E4CA0'})).concat([{e:'Razões: '+d.razoes,c:'#6E6180'}])
    : d.contratos.map((c,i)=>({e:`${i+1}. ${c.r}${c.c?' – '+c.c:''}`,s:`${c.d} · vencimento dia ${c.dia}`,d:'R$ '+brl(c.v)+'/mês',p:'#6E4CA0'}));
  cont.push({e:'PMT mensal total',d:'R$ '+brl(pmt(b)),b:1});
  secoes.push({t:`Contratos ativos: ${d.contratos.length}`,linhas:cont});
  const atrasos=d.historico.map(([k,v])=>({e:rot(k),d:'R$ '+brl(v),p:'#C1272D',cd:'#C1272D'}));
  if(somaSt(b,'atraso')>0) atrasos.push({e:rot(mesC),d:'R$ '+brl(somaSt(b,'atraso')),p:'#C1272D',cd:'#C1272D'});
  if(somaSt(b,'aberto')>0) atrasos.push({e:rot(mesC)+' (a vencer)',d:'R$ '+brl(somaSt(b,'aberto')),p:'#B07000',cd:'#B07000'});
  if(somaPago(b)>0) atrasos.push({e:rot(mesC)+' (pago)',d:'R$ '+brl(somaPago(b)),p:'#1B7F3B',cd:'#1B7F3B'});
  secoes.push({t:'Atrasos acumulados',linhas:atrasos,duasColunas:true});
  const ps=parcelas(b).filter(p=>p.st!=='pago').sort((x,z)=>x.venc.localeCompare(z.venc));
  if(d.detalhe&&ps.length&&ps.length<=12) secoes.push({t:`Parcelas de ${rot(mesC)} em aberto`,linhas:ps.map(p=>{
    const c=d.contratos[p.ci];
    return {e:`${diaBR(p.venc)} · ${c.r}`,s:c.d+(p.parcial?` · pago R$ ${brl(p.pgto)} de R$ ${brl(p.valor)}`:''),
      d:'R$ '+brl(p.sld),p:p.parcial?'#B07000':(p.st==='atraso'?'#C1272D':'#E0A33E'),cd:p.st==='atraso'?'#C1272D':'#B07000'};})});
  secoes.push({destaque:{t:'Total em atraso',v:'R$ '+brl(totalAtraso(b)),d:`${rot(mesC)}: R$ ${brl(somaSt(b,'atraso'))}`}});
  const jud=[];
  d.execucoes.forEach((e,i)=>{
    jud.push({e:`${i+1}. ${e.num}${e.sigilo?' (segredo)':''}${e.novo?' • NOVO':''} — ${e.ent}`,d:'R$ '+brl(e.val),b:1,p:e.novo?'#B07000':'#332452'});
    e.linhas.split('\n').filter(x=>x.trim()).forEach(l=>jud.push({e:limpo(l),p:corLinha(l),c:'#4A4055'}));
  });
  d.agravos.forEach(a=>jud.push({e:`Agravo ${a.num} (${a.ref}) — ${limpo(a.sit)}`,p:'#6E4CA0',c:'#4A4055'}));
  if(d.nota) jud.push({e:limpo(d.nota),b:1,c:'#7A2226'});
  secoes.push({t:`Status judicial — ${d.execucoes.length} execuç${d.execucoes.length>1?'ões':'ão'}${d.agravos.length?' + '+d.agravos.length+' agravo'+(d.agravos.length>1?'s':''):''} · exposição R$ ${brl(expo(b))}`,linhas:jud});
  const kpis=[{t:'Total em atraso',v:'R$ '+brl(totalAtraso(b)),c:'#C1272D'},
    {t:'PMT mensal',v:'R$ '+brl(pmt(b))},
    {t:'Exposição judicial',v:'R$ '+brl(expo(b)),c:ACENTO[b]},
    {t:'Processos',v:String(d.execucoes.length+d.agravos.length)}];
  if(d.retencao&&(d.retencao.novo>0||d.retencao.anterior>0)) kpis.push({t:'Retido iFood '+d.retencao.data,v:'R$ '+brl(totalRetido(d.retencao)),c:'#B07000'});
  return montarSVG({titulo:`PMT MENSAL — BANCO ${b}`,sub:`Fechamento semanal — ${dataBR()}`,acento:ACENTO[b]||'#4A3170',
    banco:b,kpis,secoes});
}

function cardConsolidado(){
  const meses=new Set(); nomes().forEach(b=>{DB.bancos[b].historico.forEach(([k])=>meses.add(k)); meses.add(DB.bancos[b].corrente.mes);});
  const ord=[...meses].sort();
  const valMes=k=>nomes().reduce((s,b)=>{const d=DB.bancos[b];const l=d.historico.find(x=>x[0]===k);return s+(l?l[1]:(d.corrente.mes===k?somaSt(b,'atraso'):0));},0);
  const secoes=[
    {t:'Evolução mensal de atrasos',duasColunas:true,linhas:ord.map(k=>({e:rot(k),d:'R$ '+brl(valMes(k)),p:'#C1272D',cd:'#C1272D'}))},
    {t:'Atraso por banco',linhas:nomes().map(b=>[b,totalAtraso(b)]).sort((a,c)=>c[1]-a[1])
      .map(([b,v],i)=>({e:`${i+1}º ${b}`,d:'R$ '+brl(v),b:1,p:ACENTO[b]}))},
    {destaque:{t:'Total geral em atraso',v:'R$ '+brl(totalGeral())}},
    {t:`Acompanhamento judicial — ${nomes().reduce((s,b)=>s+DB.bancos[b].execucoes.length,0)} execuções + ${nomes().reduce((s,b)=>s+DB.bancos[b].agravos.length,0)} agravos`,
     linhas:nomes().flatMap(b=>{
       const d=DB.bancos[b];
       const cab={e:`${b} — ${d.execucoes.length} execuç${d.execucoes.length>1?'ões':'ão'}${d.agravos.length?' + '+d.agravos.length+' agravo'+(d.agravos.length>1?'s':''):''}`,d:'R$ '+brl(expo(b)),b:1,p:ACENTO[b]};
       const it=d.execucoes.map(e=>({e:`${e.num}${e.novo?' • NOVO':''} — ${e.ent}`,d:'R$ '+brl(e.val),c:'#4A4055'}));
       return [cab,...it];
     })}
  ];
  const nv=[]; nomes().forEach(b=>DB.bancos[b].execucoes.filter(e=>e.novo).forEach(e=>nv.push(`${b}: ${e.num} — ${e.ent}`)));
  if(nv.length) secoes.push({t:'Pontos cruciais da semana',linhas:nv.map(t=>({e:t,p:'#B07000'}))});
  const S=(DB.semanas||[]).slice().sort((a,c)=>c.data.localeCompare(a.data)).find(x=>x.data<DB.fechamento);
  const dif=S?totalGeral()-S.geral:0;
  const kpis=[{t:'Total geral em atraso',v:'R$ '+brl(totalGeral()),c:'#C1272D'},
    {t:'Exposição judicial',v:'R$ '+brl(nomes().reduce((s,b)=>s+expo(b),0)),c:'#4A3170'},
    {t:'Processos ativos',v:String(nomes().reduce((s,b)=>s+DB.bancos[b].execucoes.length+DB.bancos[b].agravos.length,0))}];
  if(S) kpis.push({t:'Desde '+dBR(S.data),v:(dif>0?'+':'')+'R$ '+brl(dif),c:dif>0?'#C1272D':'#1B7F3B'});
  return montarSVG({titulo:'CONSOLIDADO PMT — TODOS OS BANCOS',sub:`Atrasos acumulados — ${dataBR()}`,acento:'#4A3170',
    kpis,secoes});
}

function cardRetencao(b){
  const r=DB.bancos[b].retencao;
  const somaD=r.destino.reduce((s,x)=>s+(x.v||0),0);
  const secoes=[{t:`${b} — ${r.ent}`,linhas:[
    ...(r.anterior>0?[{e:'Retido anteriormente',d:'R$ '+brl(r.anterior),p:'#6E6180'}]:[]),
    {e:`Novo valor retido em ${r.data}`,d:'R$ '+brl(r.novo),b:1,p:'#C1272D',cd:'#C1272D'},
    {e:'Total retido atual',d:'R$ '+brl(totalRetido(r)),b:1,p:'#2E2148'}
  ]}];
  if(r.destino.length) secoes.push({t:`Destinação dos valores${r.dataUso?' — '+r.dataUso:''}`,
    linhas:[...r.destino.map(x=>({e:x.t,d:'R$ '+brl(x.v||0),p:'#6E4CA0'})),{e:'Total',d:'R$ '+brl(somaD),b:1}]});
  if(r.recuperado>0) secoes.push({t:'Resultado',linhas:[{e:'Valor recuperado e redirecionado',d:'R$ '+brl(r.recuperado),b:1,p:'#1B7F3B',cd:'#1B7F3B'}]});
  if(r.conclusao) secoes.push({t:'Observação',linhas:[{e:limpo(r.conclusao),c:'#4A4055'}]});
  const dq = r.recuperado>0
    ? {t:'Valor recuperado e redirecionado',v:'R$ '+brl(r.recuperado),d:'Total ainda retido: R$ '+brl(totalRetido(r)),
       c:'#1B7F3B',bg:'#EAF6EC',tc:'#1B5B30'}
    : {t:'Total retido atual',v:'R$ '+brl(totalRetido(r))};
  const kpis=[{t:'Retido em '+r.data,v:'R$ '+brl(r.novo),c:'#C1272D'}];
  if(r.anterior>0) kpis.push({t:'Retido anteriormente',v:'R$ '+brl(r.anterior)});
  kpis.push({t:'Total retido atual',v:'R$ '+brl(totalRetido(r)),c:'#2E2148'});
  if(r.recuperado>0) kpis.push({t:'Recuperado',v:'R$ '+brl(r.recuperado),c:'#1B7F3B'});
  return montarSVG({titulo:'CONTA VINCULADA — RETENÇÕES iFOOD',sub:`${b} · ${r.ent} · ${r.data}`,acento:ACENTO[b]||'#4A3170',
    banco:b,kpis,secoes,destaque:dq,evidencia:r.evidencia||'',semLegenda:true});
}

function svgParaBlob(svg){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=img.width*2; c.height=img.height*2;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(bl=>bl?res(bl):rej(new Error('falha ao gerar')),'image/png');
    };
    img.onerror=()=>rej(new Error('não consegui montar a imagem'));
    img.src=url;
  });
}
async function baixarImg(svg,nome){ try{ const bl=await svgParaBlob(svg);
  const a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download=nome; a.click(); toast('Imagem baixada');
}catch(e){ toast(e.message); } }
async function copiarImg(svg){ try{ const bl=await svgParaBlob(svg);
  await navigator.clipboard.write([new ClipboardItem({'image/png':bl})]); toast('Imagem copiada — cole no WhatsApp');
}catch(e){ toast('Não deu para copiar; use "Baixar imagem"'); } }

async function unzip(buf){
  const dv=new DataView(buf); let eo=-1;
  for(let i=buf.byteLength-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0) throw new Error('não parece um .xlsx');
  const n=dv.getUint16(eo+10,true); let off=dv.getUint32(eo+16,true); const f={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const met=dv.getUint16(off+10,true), cs=dv.getUint32(off+20,true);
    const nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true);
    const lo=dv.getUint32(off+42,true);
    const nome=new TextDecoder().decode(new Uint8Array(buf,off+46,nl));
    const lnl=dv.getUint16(lo+26,true), lel=dv.getUint16(lo+28,true);
    f[nome]={met,data:new Uint8Array(buf,lo+30+lnl+lel,cs)};
    off+=46+nl+el+cl;
  }
  const out={};
  for(const [nome,x] of Object.entries(f)){
    if(!/\.(xml|rels)$/i.test(nome)) continue;
    let bytes=x.data;
    if(x.met===8){ const st=new Blob([x.data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); bytes=new Uint8Array(await new Response(st).arrayBuffer()); }
    else if(x.met!==0) continue;
    out[nome]=new TextDecoder('utf-8').decode(bytes);
  }
  return out;
}
function numPlanilha(x){
  let s=String(x==null?'':x).trim(); if(!s) return 0;
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);            // número puro do XML
  s=s.replace(/[^\d.,-]/g,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.');  // 1.234,56
  else s=s.replace(/,/g,'');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
const colIdx=r=>{const m=r.match(/^([A-Z]+)/);if(!m)return 0;let n=0;for(const ch of m[1])n=n*26+(ch.charCodeAt(0)-64);return n-1;};
async function lerPlanilha(file){
  const xml=await unzip(await file.arrayBuffer()), P=new DOMParser(), sh=[];
  if(xml['xl/sharedStrings.xml']) P.parseFromString(xml['xl/sharedStrings.xml'],'application/xml')
    .querySelectorAll('si').forEach(si=>sh.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
  const wb=P.parseFromString(xml['xl/workbook.xml'],'application/xml');
  const rels=P.parseFromString(xml['xl/_rels/workbook.xml.rels'],'application/xml');
  const mapa={}; rels.querySelectorAll('Relationship').forEach(r=>mapa[r.getAttribute('Id')]=r.getAttribute('Target'));
  let alvo=null;
  wb.querySelectorAll('sheet').forEach(s=>{ if(/Banc/i.test(s.getAttribute('name')||'')){
    const rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'); alvo=mapa[rid]; }});
  if(!alvo) throw new Error('aba de processos bancários não encontrada');
  const path=alvo.startsWith('/')?alvo.slice(1):'xl/'+alvo.replace(/^\.?\//,'');
  const doc=P.parseFromString(xml[path],'application/xml'), linhas=[];
  doc.querySelectorAll('row').forEach(row=>{
    const arr=[];
    row.querySelectorAll('c').forEach(c=>{
      const i=colIdx(c.getAttribute('r')||'A1'), t=c.getAttribute('t');
      arr[i] = t==='s' ? (sh[+(c.querySelector('v')?.textContent||0)]||'')
             : t==='inlineStr' ? [...c.querySelectorAll('t')].map(x=>x.textContent).join('')
             : (c.querySelector('v')?.textContent||'');
    });
    linhas.push(arr);
  });
  return linhas;
}
function aplicar(linhas,nomeArq){
  let ach=0,mud=0;
  nomes().forEach(b=>{
    const alvo=b==='ITAÚ'?'ITAU':b;
    [...DB.bancos[b].execucoes,...DB.bancos[b].agravos].forEach(p=>{
      const l=linhas.find(r=>r&&(r[0]||'').includes(p.num)&&(r[5]||'').toUpperCase().includes(alvo));
      if(!l) return; ach++;
      const novo=(l[9]||'').trim();
      p.mudou=!!p.raw&&p.raw!==novo; if(p.mudou){ mud++; p.pendente=true; }
      p.raw=novo; p.partes=(l[8]||'').trim();
      const v=numPlanilha(l[7]);
      if(p.val&&v>0&&v<p.val*50&&v>p.val/50) p.val=v;   // ignora leitura absurda
    });
  });
  DB.ultimaPlanilha={arq:nomeArq||'',quando:new Date().toLocaleString('pt-BR'),ach,mud};
  return {ach,mud};
}
const pendentes=b=>[...DB.bancos[b].execucoes,...DB.bancos[b].agravos].filter(p=>p.pendente).length;
const pendentesTotal=()=>nomes().reduce((s,b)=>s+pendentes(b),0);
document.getElementById('btnPlanilha').onclick=()=>document.getElementById('filePlanilha').click();
document.getElementById('filePlanilha').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const st=document.getElementById('statusPlanilha'); st.textContent='Lendo…';
  try{ const {ach,mud}=aplicar(await lerPlanilha(f),f.name);
    let att=0; if(DB.autoResumo!==false) nomes().forEach(x=>{att+=aplicarResumos(x);});
    st.textContent=`${ach} processos lidos · ${mud} com andamento novo · ${att} resumos atualizados`;
    render(); toast(mud?`${mud} andamento(s) mudaram — mensagens já atualizadas`:'Nenhuma mudança de andamento');
  }catch(err){ st.textContent='Erro: '+err.message; }
  e.target.value='';
};

function salvarPainel(){
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#conteudo').innerHTML='';
  clone.querySelector('#abas').innerHTML='';
  clone.querySelector('#statusPlanilha').textContent='';
  let html='<!doctype html>\n<html lang="pt-BR">'+clone.innerHTML+'</html>';
  const dados=JSON.stringify(DB).replace(/<\//g,'<\\/');
  html=html.replace(/\/\*DB_INICIO\*\/[\s\S]*?\/\*DB_FIM\*\//,'/*DB_INICIO*/'+dados+'/*DB_FIM*/');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=`Painel_PMT_Ragga_${DB.fechamento}.html`; a.click();
  toast('Painel salvo com os dados desta semana');
}

document.getElementById('btnSalvar').onclick=()=>{ if(!fotoAtual()){ arquivarSemana(true); render(); } salvarPainel(); };

document.getElementById('btnRestaurar').onclick=()=>document.getElementById('fileBackup').click();
document.getElementById('fileBackup').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ DB=JSON.parse(await f.text()); normalizar(); render(); toast('Backup restaurado'); }catch(x){ toast('JSON inválido'); }
  e.target.value='';
};
const RETVAZIA=()=>({ent:'',data:'',anterior:0,novo:0,dataUso:'',recuperado:0,destino:[],conclusao:'',evidencia:''});
function normalizar(){
  nomes().forEach(b=>{ if((b==='SANTANDER'||b==='SAFRA') && !DB.bancos[b].retencao) DB.bancos[b].retencao=RETVAZIA(); });
  nomes().forEach(b=>{ DB.bancos[b].corrente.parcelas.forEach(p=>{
    if(p.pgto===undefined) p.pgto = p.pago===true ? p.valor : 0;
    if(p.obs===undefined) p.obs='';
    delete p.pago;
  });});
}
async function autoSalvar(){ try{ if(window.storage) await window.storage.set('pmt-ragga',JSON.stringify(DB)); }catch(x){} }
(async()=>{
  try{ if(window.storage){ const r=await window.storage.get('pmt-ragga'); if(r&&r.value) DB=JSON.parse(r.value); } }catch(x){}
  normalizar(); render();
})();
